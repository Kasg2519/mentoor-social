<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Mentoor">
  <!-- Reproduce .mobile-logo de src/styles.css con el tema por defecto
       (Oscuro · ámbar). OJO: en la app este cuadrado usa --accent-gradient,
       así que CAMBIA de color con el tema que elija el alumno. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="36" height="36" rx="10" fill="url(#g)"/>
  <text x="18" y="18.5" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#1A1208">M</text>
</svg>
