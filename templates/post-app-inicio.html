<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../brand/redes.css">
<style>
*{box-sizing:border-box;margin:0}body{background:#000}
.s{width:1080px;height:1350px;background:var(--bg);color:var(--text);font-family:var(--sans);padding:92px 88px 0;position:relative;overflow:hidden}
.s::before{content:"";position:absolute;inset:0;background:radial-gradient(760px 760px at 100% 100%,rgba(245,158,11,.26),transparent 65%),repeating-linear-gradient(0deg,transparent 0 59px,rgba(255,255,255,.035) 59px 60px)}
.s>*{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;font-size:24px;letter-spacing:5px;text-transform:uppercase;color:var(--amber);font-weight:700}
h1{font-weight:900;font-size:104px;line-height:1.03;letter-spacing:-3px;margin-top:48px}
h1 em{font-style:normal;color:var(--amber)}
p{font-size:36px;line-height:1.4;color:var(--dim);margin-top:26px;max-width:760px}
.phone{position:absolute;left:50%;transform:translateX(-50%);bottom:-70px;width:560px;height:660px;border-radius:64px 64px 0 0;border:10px solid #2a2832;border-bottom:0;overflow:hidden;background:#000;box-shadow:0 0 120px rgba(245,158,11,.25)}
.phone img{width:100%;display:block}
.tag{position:absolute;right:70px;bottom:120px;background:var(--amber-grad);color:var(--ink);font-weight:900;font-size:34px;padding:24px 38px;border-radius:999px}
.logo{width:68px;height:68px;border-radius:22px;background:var(--logo-gradient);color:var(--logo-letra);font-weight:900;font-size:42px;display:flex;align-items:center;justify-content:center}
.note{position:absolute;left:88px;top:688px;font-size:24px;color:var(--muted)}
</style></head><body>
<div class="s" id="p1">
<div class="top"><span>Mentoor · gratis</span><div class="logo">M</div></div>
<h1>Tu cuenta regresiva a la PAES, <em>en tu bolsillo.</em></h1>
<p>Días, horas y minutos. Y tu calculadora a un toque.</p>
<div class="phone"><img src="../brand/photos/app/app-inicio-completo.jpg"></div>
<div class="note">@mentoor.cl · Datos de demostración</div>
</div></body></html>
