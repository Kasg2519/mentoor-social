<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../brand/redes.css">
<style>
:root{--tinta:#1F36E0;--coral:#F2593B;--verde:#1FA36A;--cielo:#3FA9F5;--negro:#1A1208}
*{box-sizing:border-box;margin:0}body{background:#000}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:var(--sans);background:linear-gradient(135deg,#FCC23C 0%,#F7AE1C 60%,#F29A10 100%);color:var(--tinta);padding:84px 80px}
.top{display:flex;justify-content:space-between;align-items:center}
.pills{display:flex;gap:16px}
.pill{font-size:26px;font-weight:800;letter-spacing:3px;padding:14px 30px;border-radius:999px;text-transform:uppercase}
.p1{background:#fff;color:var(--tinta)}.p2{background:var(--tinta);color:#fff}
.logo{width:68px;height:68px;border-radius:22px;background:var(--negro);color:#FBBF24;font-weight:900;font-size:42px;display:flex;align-items:center;justify-content:center}
h1{font-size:118px;line-height:.98;font-weight:900;letter-spacing:-4px;margin-top:70px;max-width:900px}
h1 span{color:var(--negro)}
p{font-size:42px;line-height:1.35;font-weight:600;margin-top:34px;max-width:720px;color:var(--negro)}
.art{position:absolute;left:0;right:0;bottom:118px;height:560px}
.foot{position:absolute;left:80px;right:80px;bottom:56px;display:flex;justify-content:space-between;font-size:30px;font-weight:700;color:var(--negro)}
</style></head><body>
<div class="s" id="il">
<div class="top"><div class="pills"><span class="pill p1">Gratis</span><span class="pill p2">Fácil</span></div><div class="logo">M</div></div>
<h1>Tranquilo/a,<br>vamos <span>paso<br>a paso.</span></h1>
<p>Tu puntaje PAES, tus opciones y tus fechas, en un solo lugar.</p>

<svg class="art" viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
<defs>
 <filter id="w" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
</defs>
<g filter="url(#w)" stroke-width="9" transform="translate(70,0)">
 <!-- CALCULADORA (grande) : capa desalineada naranja + capa azul -->
 <g transform="translate(70,90) scale(.95)">
  <g stroke="#F2593B" transform="translate(12,10)"><rect x="0" y="0" width="330" height="440" rx="42"/><rect x="38" y="42" width="254" height="96" rx="18"/></g>
  <g stroke="#1F36E0"><rect x="0" y="0" width="330" height="440" rx="42"/><rect x="38" y="42" width="254" height="96" rx="18"/>

   <path d="M234 328v66" stroke="#1FA36A"/>

 </g>
 <!-- CALENDARIO -->

  <g stroke="#3FA9F5" transform="translate(-10,10)"><rect x="0" y="40" width="300" height="270" rx="30"/></g>
  <g stroke="#1F36E0"><rect x="0" y="40" width="300" height="270" rx="30"/><path d="M0 120h300M80 10v60M220 10v60"/></g>

 </g>
 <!-- CELULAR con check -->

  <g stroke="#FBF3D0" transform="translate(10,8)"><rect x="0" y="0" width="170" height="300" rx="34"/></g>
  <g stroke="#1F36E0"><rect x="0" y="0" width="170" height="300" rx="34"/><path d="M70 28h30"/></g>
  <g stroke="#1FA36A"><circle cx="85" cy="150" r="46"/><path d="M62 150l16 18 32-38"/></g>
 </g>
 <!-- GARABATOS / chispas -->
 <g stroke="#1A1208" stroke-width="7">
  <path d="M430 150l12-34M470 120l30-26M410 188l-34-6"/>
  <path d="M800 120c20-26 44 22 66-8s40 20 62-6"/>
  <path d="M40 90c18-24 38 20 58-6"/>
 </g>
 <g stroke="#F2593B" stroke-width="8"><circle cx="1010" cy="120" r="16"/><path d="M950 470l16 0M958 462v16"/></g>
 <g stroke="#1F36E0" stroke-width="8"><path d="M60 560q40-40 80 0t80 0"/></g>
</g>
</svg>
<div class="foot"><span>@mentoor.cl</span><span>mentoor.cl</span></div>
</div></body></html>
