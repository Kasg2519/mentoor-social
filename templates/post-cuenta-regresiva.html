<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../brand/redes.css">
<style>
*{box-sizing:border-box;margin:0}body{background:#000}
.s{width:1080px;height:1350px;background:var(--bg);color:var(--text);font-family:var(--sans);padding:92px 88px 80px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.s::before{content:"";position:absolute;inset:0;background:radial-gradient(760px 760px at 100% 100%,rgba(245,158,11,.22),transparent 65%),repeating-linear-gradient(0deg,transparent 0 59px,rgba(255,255,255,.035) 59px 60px)}
.s>*{position:relative}
.top{display:flex;justify-content:space-between;align-items:center}
.sign{display:flex;align-items:center;gap:20px}
.logo{width:68px;height:68px;border-radius:22px;background:var(--logo-gradient);color:var(--logo-letra);font-weight:900;font-size:42px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sombra-logo)}
.sign b{font-size:36px;font-weight:800}.sign small{display:flex;align-items:center;gap:10px;font-size:22px;color:var(--text-muted);font-weight:500;margin-top:2px}
.sign small img{height:24px;mix-blend-mode:screen}
.tag{font-size:24px;letter-spacing:5px;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-weight:900;font-size:112px;line-height:1.02;letter-spacing:-3.5px;margin-top:60px}
h1 em{font-style:normal;color:var(--accent)}
.count{margin-top:48px;background:var(--surface);border:1px solid var(--border);border-radius:56px;padding:48px 52px}
.lab{display:flex;align-items:center;gap:16px;font-size:24px;letter-spacing:4px;font-weight:700;color:var(--text-muted);text-transform:uppercase}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.num{display:flex;align-items:baseline;gap:26px;margin-top:20px}
.num b{font-size:200px;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-8px;font-variant-numeric:tabular-nums}
.num span{font-size:44px;font-weight:700;color:var(--text-muted);letter-spacing:3px}
.sub{font-size:32px;color:var(--dim);margin-top:6px}
.tool{margin-top:30px;background:var(--accent-gradient);color:var(--on-accent);border-radius:56px;padding:44px 52px;box-shadow:var(--accent-glow);display:flex;justify-content:space-between;align-items:center}
.tool small{font-size:22px;letter-spacing:4px;font-weight:800;text-transform:uppercase;opacity:.75}
.tool b{display:block;font-size:50px;font-weight:900;margin-top:8px}
.tool .go{white-space:nowrap;font-size:32px;font-weight:800;background:rgba(26,18,8,.14);padding:24px 36px;border-radius:999px}
.foot{margin-top:auto;padding-top:34px;font-size:26px;color:var(--text-muted);display:flex;justify-content:space-between}
</style></head><body>
<div class="s" id="p2">
<div class="top"><div class="sign"><div class="logo">M</div><div><b>Mentoor</b><small>by <img src="../brand/logo/quanttum.jpg"></small></div></div><span class="tag">Admisión 2027</span></div>
<h1>Faltan <em>51 días</em> para la PAES.</h1>
<div class="count"><div class="lab"><span class="dot"></span>Calendario PAES · Regular</div>
<div class="num"><b>51</b><span>DÍAS</span></div>
<div class="sub">hasta el 30 de noviembre · cifra al 9 de octubre</div></div>
<div class="tool"><div><small>Herramienta destacada</small><b>Calculadora<br>PAES</b></div><div class="go">Calcular ahora →</div></div>
<div class="foot"><span>@mentoor.cl · Instala gratis, link en la bio</span><span>Verifica fechas en demre.cl</span></div>
</div></body></html>
